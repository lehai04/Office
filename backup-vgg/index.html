<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Sao lưu phòng VGG</title>
  <style>
    body { margin: 0; background: #0f172a; color: #f1f5f9; font: 1rem/1.55 system-ui, sans-serif; }
    main { max-width: 39rem; margin: 3rem auto; padding: 1.5rem; }
    h1 { font-size: 1.8rem; margin: 0 0 .6rem; }
    form { display: grid; gap: .55rem; }
    input, button { box-sizing: border-box; width: 100%; padding: .7rem; border-radius: .5rem; font: inherit; }
    input { border: 1px solid #64748b; color: #f1f5f9; background: #1e293b; }
    button { background: #a7f3d0; color: #064e3b; border: 0; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { color: #fcd34d; }
  </style>
  <script src="backup.js" defer></script>
</head>
<body>
  <main>
    <h1>Sao lưu phòng VGG</h1>
    <p>Mở trang này bằng đúng trình duyệt đang đăng nhập trưởng phòng VGG. Chờ danh sách thành viên và chat cũ tải trong game trước khi sao lưu.</p>
    <p id="summary" aria-live="polite"></p>
    <form id="backup">
      <label for="passphrase">Mật khẩu riêng cho tệp sao lưu (tối thiểu 12 ký tự)</label>
      <input id="passphrase" type="password" minlength="12" autocomplete="new-password" required>
      <label for="repeat">Nhập lại mật khẩu sao lưu</label>
      <input id="repeat" type="password" minlength="12" autocomplete="new-password" required>
      <button id="download" type="submit" disabled>Tải bản sao lưu mã hóa</button>
    </form>
    <p id="status" role="status">Đang kiểm tra dữ liệu trên trình duyệt…</p>
    <p>Tệp tải về thiết bị này. Hãy giữ riêng mật khẩu sao lưu để mở tệp khi nhập dữ liệu.</p>
  </main>
</body>
</html>
